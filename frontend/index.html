<!DOCTYPE html>
<html>
<head>
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Smart Expense Tracker and Budget Prediction System</h1>

    <h2>Add Income</h2>
    <input type="number" id="income" placeholder="Enter Income">

    <h2>Add Expense</h2>
    <input type="text" id="category" placeholder="Expense Category">
    <input type="number" id="amount" placeholder="Expense Amount">

    <br><br>

    <button>Add Expense</button>

    <h2>Budget Summary</h2>

    <p>Total Income: ₹0</p>
    <p>Total Expenses: ₹0</p>
    <p>Remaining Budget: ₹0</p>

    <script src="script.js"></script>

</body>
</html>
