<!DOCTYPE html>
<html>
<head>
    <title>Smart Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Smart Expense Tracker and Budget Prediction System</h1>

    <h2>Add Income</h2>
    <input type="number" id="income" placeholder="Enter Income">

    <h2>Add Expense</h2>
    <input type="text" id="category" placeholder="Expense Category">
    <input type="number" id="amount" placeholder="Expense Amount">

    <br><br>

   <button onclick="addExpense()">Add Expense</button>

    <h2>Budget Summary</h2>

   <p>Total Income: ₹<span id="totalIncome">0</span></p>
   <p>Total Expenses: ₹<span id="totalExpense">0</span></p>
   <p>Remaining Budget: ₹<span id="remainingBudget">0</span></p>

    <script src="script.js"></script>

    <h2>Budget Prediction</h2>

    <p>
    Predicted Next Month Expense:
    <span id="prediction">₹22000</span>
    </p>

</body>
</html>
