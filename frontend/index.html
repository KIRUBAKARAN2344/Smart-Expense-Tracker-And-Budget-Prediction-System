<!DOCTYPE html>
<html>
<head>
    <title>Smart Expense Tracker</title>

    <link rel="stylesheet" href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>
<body>

    <h1>Smart Expense Tracker and Budget Prediction System</h1>

    <h2>Add Income</h2>

    <input type="number"
           id="income"
           placeholder="Enter Income">

    <h2>Add Expense</h2>

    <select id="category">
        <option value="Food">Food</option>
        <option value="Transport">Transport</option>
        <option value="Shopping">Shopping</option>
        <option value="Entertainment">Entertainment</option>
        <option value="Education">Education</option>
        <option value="Medical">Medical</option>
    </select>

    <input type="number"
           id="amount"
           placeholder="Expense Amount">

    <br><br>

    <button onclick="addExpense()">
        Add Expense
    </button>

    <h2>Dashboard</h2>

    <div class="dashboard">

        <div class="card">
            <h3>Total Income</h3>
            <p>₹<span id="totalIncome">0</span></p>
        </div>

        <div class="card">
            <h3>Total Expense</h3>
            <p>₹<span id="totalExpense">0</span></p>
        </div>

        <div class="card">
            <h3>Remaining Budget</h3>
            <p>₹<span id="remainingBudget">0</span></p>
        </div>

        <div class="card">
            <h3>AI Prediction</h3>
            <p>₹<span id="prediction">0</span></p>
        </div>

    </div>

    <h2>Expense History</h2>

    <table>
        <thead>
            <tr>
                <th>Category</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody id="expenseTable">
        </tbody>

    </table>

    <h2>Expense Analytics</h2>

    <canvas id="expenseChart"></canvas>
    <h2>Financial Health Score</h2>

<div class="ai-box">
    <p class="health-score">
        <span id="healthScore">100</span>/100
    </p>
</div>

    <script src="script.js"></script>

</body>
</html>
